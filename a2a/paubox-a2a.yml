grade: near-conformant
grade_basis: >-
  Graded against A2A 1.0.0. Hard checks all pass: capabilities is an object,
  protocolVersion is present, skills is an array. preferredTransport,
  defaultInputModes and defaultOutputModes are all present. The card falls short of
  conformant on completeness rather than shape — see deviations[].
deviations:
  - field: protocolVersion
    observed: '0.3'
    note: >-
      Declares A2A 0.3, not 1.0.0. The card is a valid 0.3-era document; it is not
      claiming 1.0 conformance.
  - field: skills[].tags
    observed: '[]'
    note: >-
      The single skill declares an empty tags array. A2A expects tags to be usable for
      skill matching; an empty array gives a routing agent nothing to match on beyond the
      description.
  - field: url / supportedInterfaces[].url
    observed: https://docs.paubox.com/
    note: >-
      The card's url and its one supportedInterface both point at the documentation site
      root, not at an A2A JSON-RPC endpoint or the MCP endpoint at
      https://mcp.paubox.com/mcp. An A2A client following this card reaches an HTML docs
      site, not an agent it can call. The card functions as a discovery signpost to the
      published Agent Skill rather than as an invocable agent descriptor.
  - field: provider.organization
    observed: Paubox API Docs
    note: >-
      Names the documentation property rather than the legal entity (Paubox, Inc.), which
      is what the security page uses.
