  - target: $.paths['/campaign_mailings'].post
    update:
      x-dry-run: >-
        Creating a campaign mailing only STORES the content — it delivers nothing. This is
        the first half of the two-step rehearsal path.
  - target: $.paths['/campaign_mailings/{campaign_mailing_id}/send_test_email'].get
    update:
      x-dry-run: >-
        The rehearsal operation. Sends a one-off preview to a single address with the
        subject prefixed "[Test]", from the account's default brand from_email/from_name.
        Use before every real send.
  - target: $.paths['/campaign_mailing_sends'].post
    update:
      x-reversibility:
        reversal: null
        window: null
        note: Delivery is irreversible and there is no idempotency key.
  - target: $.paths['/campaign_mailing_schedules'].post
    update:
      x-reversibility:
        reversal: null
        window: null
        note: >-
          No unschedule or cancel operation is published. Once a mailing is scheduled
          there is no documented API path to stop it before it sends.
  - target: $.paths['/campaign_mailings_bulk_delete'].delete
    update:
      x-reversibility:
        reversal: null
        window: null
        note: >-
          Permanent. There is no single-delete operation — delete one mailing by passing
          an array of one ID.
  - target: $.paths['/subscriptions/{subscription_id}'].delete
    update:
      x-reversibility:
        reversal: subscribeSubscribers
        window: null
        note: >-
          Stamps unsubscribed_at and KEEPS the record. The subscriber stays subscribed to
          every other list and is not globally opted out.
  - target: $.paths['/subscriptions/unsubscribe'].post
    update:
      x-reversibility:
