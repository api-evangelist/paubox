    paubox-marketing-api-openapi.yaml: 1.0.0
    paubox-forms-api-openapi.yaml: 1.0.0
  header_versioning: false
  note: >-
    Only one API version has ever been published. There is no v0 or v2, so no migration
    precedent exists to reason from.

