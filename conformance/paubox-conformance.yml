description: >-
  Standards and compliance posture for Paubox. The regulatory regime is US healthcare
  (HIPAA / HITECH), and Paubox's compliance claims are strong and central to the product.
  Its API-layer standards conformance is thinner: no OAuth on the REST APIs, no RFC 9457,
  no RFC 8594, no RFC 9116.

