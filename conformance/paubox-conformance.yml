domain_standards:
  regime: us-healthcare
  note: >-
    REWARD-ONLY CHECK — recorded honestly as a miss, not invented. Paubox operates under
    HIPAA/HITECH as a business associate and meets that regime's requirements at the
    product level (encryption of PHI in transit and at rest, BAA, HITRUST certification).
    But the healthcare interoperability data standards this check looks for in a contract
    — HL7 v2 message types, FHIR resource shapes, X12 transaction sets, C-CDA documents —
    are ABSENT from all three OpenAPI documents, and correctly so: Paubox is email and
    forms infrastructure that carries PHI, not a clinical data exchange. The Forms API
    returns a form's own JSON schema rather than a FHIR Questionnaire, and the Email API
    carries opaque message bodies. No domain standard is declared and none is expected.
  declared: []
  probed_for: [hl7v2, fhir, x12, c-cda, ncpdp, dicom]
  found: none
