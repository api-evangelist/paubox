controls_published:
  - Encryption of PHI in transit and at rest, per HHS guidance on rendering unsecured PHI unusable
  - AWS Key Management Service (KMS) for key management
  - TLS 1.2 and 1.3 only; SSL 2.0/3.0 and TLS 1.0/1.1 unsupported (NSA guidance cited)
  - Two-factor authentication on Paubox accounts
  - U.S.-only data centers, encrypted at rest
  - 99.99% uptime commitment

