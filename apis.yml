apis:
- aid: paubox-email-api
  name: Paubox Email API
  description: >-
    HIPAA compliant transactional email API. Send a single message, send bulk messages
    (batches of 50 or fewer recommended), retrieve a message receipt with delivery, open
    and click tracking, and manage Handlebars dynamic templates for templated sends.
    Authenticates with an API key issued per verified sending domain, passed as
    `Authorization: Bearer YOUR_API_KEY` (the legacy `Token token=` form is still
    accepted). An SMTP relay is offered as an alternative transport.
  humanURL: https://docs.paubox.com/email-api
  baseURL: https://api.paubox.com/v1/email
  tags:
  - Email
  - Transactional Email
  - HIPAA
  - Templates
  properties:
  - type: OpenAPI
    url: openapi/paubox-email-api-openapi.yaml
  - type: Documentation
    url: https://docs.paubox.com/email-api
  - type: GettingStarted
    url: https://docs.paubox.com/email-api/quickstart
  - type: Authentication
    url: https://docs.paubox.com/email-api/authentication
  - type: Overlay
    url: overlays/paubox-email-api-overlay.yaml
- aid: paubox-marketing-api
  name: Paubox Marketing API
  description: >-
    HIPAA compliant email marketing API. Create, fetch, update, send, schedule, test and
    bulk-delete campaign mailings; run drip campaigns; manage subscribers, subscriptions
    and subscription lists including dynamic lists and global opt-out; list tracking
    links; and read campaign, send, delivery and tracking-link analytics. Authenticates
    with `Authorization: Token token=<API_KEY>`.
  humanURL: https://docs.paubox.com/marketing
  baseURL: https://api.paubox.com/v1/marketing
  tags:
  - Email Marketing
  - Campaigns
  - Subscribers
  - Analytics
  properties:
  - type: OpenAPI
    url: openapi/paubox-marketing-api-openapi.yaml
  - type: Documentation
    url: https://docs.paubox.com/marketing
  - type: Overlay
    url: overlays/paubox-marketing-api-overlay.yaml
- aid: paubox-forms-api
  name: Paubox Forms API
  description: >-
    HIPAA compliant online form API. Public respondent-facing endpoints retrieve a form
    definition (HTML, JSON schema, CSS) and submit a response with no authentication —
    the form UUID is the access control. Authenticated management endpoints, which
    require an API key carrying the `forms` scope as a Bearer token, list, create,
    update, copy, archive and unarchive forms, return form statistics, and list or
    export submissions as CSV and PDF.
  humanURL: https://docs.paubox.com/forms/index
  baseURL: https://api.paubox.com/v1/forms
  tags:
  - Forms
  - Submissions
  - HIPAA
  - Patient Intake
  properties:
  - type: OpenAPI
    url: openapi/paubox-forms-api-openapi.yaml
  - type: Documentation
    url: https://docs.paubox.com/forms/index
  - type: Authentication
    url: https://docs.paubox.com/forms/authentication
  - type: Overlay
    url: overlays/paubox-forms-api-overlay.yaml
- aid: paubox-mcp-server
  name: Paubox MCP Server
  description: >-
    Hosted Model Context Protocol server exposing 30 Paubox tools across email, forms and
    email marketing to MCP-compatible AI clients. Reachable over streamable HTTP at
    https://mcp.paubox.com/mcp with OAuth or an `x-paubox-api-key` header, and over stdio
    via the `@paubox/mcp` package.
  humanURL: https://docs.paubox.com/mcp-server/index
  baseURL: https://mcp.paubox.com/mcp
  tags:
  - MCP
  - Agents
  - Email
  properties:
  - type: MCPServer
    url: mcp/paubox-mcp.yml
  - type: ToolCrosswalk
    url: mcp/paubox-tool-crosswalk.yml
  - type: Documentation
    url: https://docs.paubox.com/mcp-server/tools
