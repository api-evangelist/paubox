aid: paubox
name: Paubox
description: >-
  Paubox is a HIPAA compliant, HITRUST certified email infrastructure company serving
  healthcare organizations in the United States. Its products encrypt outbound email
  without recipient portals, passwords, or plugins, and work alongside Google Workspace
  and Microsoft 365. The developer surface is three REST APIs on api.paubox.com — the
  Paubox Email API for transactional email (send, bulk send, message receipt, Handlebars
  dynamic templates, templated messages) with an SMTP relay alternative at
  smtp.paubox.com:587; the Paubox Marketing API for HIPAA compliant campaign mailings,
  drip campaigns, subscribers, subscription lists, tracking links and campaign analytics;
  and the Paubox Forms API for building, hosting and processing secure patient intake
  forms with public respondent endpoints and scoped management endpoints. Paubox
  publishes OpenAPI 3.0 definitions for all three, official SDKs for ten languages, a
  Node-based CLI, delivery webhooks, an llms.txt, an A2A agent card, a published Agent
  Skill, and a hosted MCP server at mcp.paubox.com exposing 30 tools across email,
  forms and marketing.
