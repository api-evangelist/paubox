generated: '2026-08-26'
method: searched
source: https://docs.paubox.com/email-api/limits.md
name: Paubox API Rate Limits
description: Paubox publishes hard sending limits (recipients, attachment size, batch size) and plan quotas with
  overage pricing, but does NOT publish a numeric request rate limit and does NOT document any rate-limit response
  header. An agent gets no runtime pacing signal — only the 429 itself.
docs: https://docs.paubox.com/email-api/limits
limit_count: 3
quota_limits:
  note: Monthly send quotas are plan-attached rather than rate limits. Exceeding them does not return 429 — it bills
    overage. See plans/paubox-plans-pricing.yml.
  tiers:
  - plan: Free
    monthly_emails: 300
    overage_per_email_usd: null
  - plan: Pro
    monthly_emails: 10000
    overage_per_email_usd: 0.013
  - plan: Pro
    monthly_emails: 30000
    overage_per_email_usd: 0.013
  - plan: Pro
    monthly_emails: 50000
    overage_per_email_usd: 0.01
  - plan: Pro
    monthly_emails: 100000
    overage_per_email_usd: 0.0098
  - plan: Pro
    monthly_emails: null
    overage_per_email_usd: null
    note: Custom volume — priced on request.
exhaustion:
  status_code: 429
  status_title: Too Many Requests
  documented_at: https://docs.paubox.com/email-api/errors
  guidance: 'Provider guidance is verbatim: "back off and retry."'
response_headers:
  documented: false
  ratelimit_headers: []
  retry_after: false
  note: 'No RateLimit-*, X-RateLimit-* or Retry-After header is documented anywhere in docs.paubox.com, and no rate-limit
    header appears in any response definition in the three OpenAPI documents. The 429 status is the only runtime
    signal published. This is the largest single agent-readiness gap in the Paubox surface: a client cannot pace
    itself, only react after being refused.'
gaps:
- No numeric requests-per-second or requests-per-minute limit is published for any API.
- No rate-limit headers are documented, so backoff interval is entirely client-chosen.
- 429 is not declared as a response on any operation in any OpenAPI document.
limits:
