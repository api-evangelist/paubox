  source: https://docs.paubox.com/email-api/limits
  limit_text: '| Max recipients per message | 100 |'
- name: Max attachment size per message
  scope: per-request
  api: Paubox Email API
  limit: 50
  unit: MB (total across all attachments)
  operations:
  - sendMessage
  - sendBulkMessages
  source: https://docs.paubox.com/email-api/limits
  limit_text: '| Max attachment size (total per message) | 50 MB |'
- name: Recommended bulk batch size
  scope: per-request
  api: Paubox Email API
  limit: 50
  unit: messages per request
  enforced: false
  note: Published as a provider recommendation, not a hard cap.
  operations:
  - sendBulkMessages
  source: https://docs.paubox.com/email-api/limits
  limit_text: Paubox recommends batches of 50 or fewer messages per request.
